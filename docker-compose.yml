services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: attendance
      POSTGRES_USER: attendance
      POSTGRES_PASSWORD: attendance
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attendance"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      APP_DATABASE_URL: postgresql+psycopg2://attendance:attendance@postgres:5432/attendance
      APP_CORS_ORIGINS: '["http://localhost:3000"]'
      # Optional real Zalo integration — pass through from the host shell
      # (`export ZALO_BOT_TOKEN=...` before `docker compose up`). Left unset,
      # the backend falls back to NullMessagePublisher / manual attendance.
      ZALO_BOT_TOKEN: ${ZALO_BOT_TOKEN:-}
      ZALO_GROUP_CHAT_ID: ${ZALO_GROUP_CHAT_ID:-}
      ZALO_CHECKIN_KEYWORD: ${ZALO_CHECKIN_KEYWORD:-tham gia}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  pgdata:
